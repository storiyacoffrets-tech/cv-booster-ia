<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon compte — CV Designer IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16211c;
    --ink-soft: #3d4a43;
    --paper: #f7f3ea;
    --paper-card: #ffffff;
    --line: #ded5c2;
    --accent: #1f5c4e;
    --accent-soft: #e4efe9;
    --shadow: 0 20px 45px -20px rgba(22, 33, 28, 0.35);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--paper); color: var(--ink); }
  a { text-decoration: none; color: inherit; }

  nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 22px 32px; max-width: 900px; margin: 0 auto;
  }
  .logo { font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.2rem; }
  .nav-link { font-size: 0.85rem; font-weight: 600; color: var(--ink-soft); }

  main { max-width: 560px; margin: 30px auto 80px; padding: 0 24px; }

  .card {
    background: var(--paper-card); border: 1px solid var(--line); border-radius: 16px;
    padding: 32px; box-shadow: var(--shadow);
  }
  h1 { font-family: 'Fraunces', serif; font-size: 1.7rem; margin: 0 0 10px; }
  p.sub { color: var(--ink-soft); margin: 0 0 24px; line-height: 1.5; }

  label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
  input[type="email"] {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
    font-size: 0.95rem; font-family: 'Inter', sans-serif; background: var(--paper); margin-bottom: 14px;
  }
  input:focus { outline: 2px solid var(--accent); }
  button.primary {
    width: 100%; padding: 14px; background: var(--accent); color: white; border: none;
    border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
  }
  button.primary:hover { background: #164a3f; }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .msg { font-size: 0.85rem; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; display: none; }
  .msg.success { background: var(--accent-soft); color: var(--accent); display: block; }
  .msg.error { background: rgba(181,71,63,0.12); color: #7a2a24; display: block; }

  .cv-list { display: flex; flex-direction: column; gap: 14px; }
  .cv-row {
    display: flex; justify-content: space-between; align-items: center; gap: 14px;
    background: var(--paper-card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px;
  }
  .cv-row .name { font-weight: 700; font-size: 0.95rem; }
  .cv-row .title { font-size: 0.82rem; color: var(--accent); font-weight: 600; }
  .cv-row .date { font-size: 0.75rem; color: #999; margin-top: 2px; }
  .cv-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn-small {
    padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; border: none;
  }
  .btn-edit { background: var(--accent-soft); color: var(--accent); }
  .btn-edit:hover { background: var(--accent); color: white; }
  .btn-view { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--line); }

  .account-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .logout-link { font-size: 0.8rem; color: var(--ink-soft); cursor: pointer; }
  .empty-state { text-align: center; color: var(--ink-soft); padding: 40px 20px; }
  .empty-state a { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">CV Designer IA</a>
  <a class="nav-link" href="builder.html">+ Nouveau CV</a>
</nav>

<main>
  <div id="loginView" style="display:none;">
    <div class="card">
      <h1>Mon compte</h1>
      <p class="sub">Entrez votre email pour recevoir un lien de connexion sécurisé (sans mot de passe).</p>
      <div id="loginMsg" class="msg"></div>
      <label for="emailInput">Email</label>
      <input type="email" id="emailInput" placeholder="vous@email.com">
      <button class="primary" id="requestLoginBtn">Recevoir mon lien de connexion</button>
    </div>
  </div>

  <div id="dashboardView" style="display:none;">
    <div class="account-header">
      <h1 style="margin:0;">Mes CV</h1>
      <span class="logout-link" id="logoutBtn">Se déconnecter</span>
    </div>
    <div id="cvList" class="cv-list"></div>
  </div>
</main>

<script>
async function checkAuth() {
  const res = await fetch("/api/me", { credentials: "include" });
  const data = await res.json();
  if (data.loggedIn) {
    document.getElementById("dashboardView").style.display = "block";
    loadCVs();
  } else {
    document.getElementById("loginView").style.display = "block";
  }
}

document.getElementById("requestLoginBtn").addEventListener("click", async () => {
  const email = document.getElementById("emailInput").value.trim();
  const msg = document.getElementById("loginMsg");
  const btn = document.getElementById("requestLoginBtn");
  msg.className = "msg";
  msg.style.display = "none";

  if (!email || !email.includes("@")) {
    msg.className = "msg error";
    msg.textContent = "Merci d'entrer un email valide.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Envoi en cours...";
  try {
    const res = await fetch("/api/auth/request-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Erreur");
    msg.className = "msg success";
    msg.textContent = "✅ Vérifiez votre boîte mail : un lien de connexion vient de vous être envoyé (valable 30 minutes).";
  } catch (err) {
    msg.className = "msg error";
    msg.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Recevoir mon lien de connexion";
  }
});

async function loadCVs() {
  const listEl = document.getElementById("cvList");
  try {
    const res = await fetch("/api/my-cvs", { credentials: "include" });
    const data = await res.json();
    if (!data.cvs || data.cvs.length === 0) {
      listEl.innerHTML = `<div class="empty-state">Vous n'avez pas encore de CV sauvegardé.<br><a href="builder.html">Créez votre premier CV →</a></div>`;
      return;
    }
    listEl.innerHTML = data.cvs.map((row) => {
      const cv = row.data;
      const date = new Date(row.updated_at).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
      return `
        <div class="cv-row">
          <div>
            <div class="name">${escHtml(cv.fullName)}</div>
            <div class="title">${escHtml(cv.jobTitle)}</div>
            <div class="date">Mis à jour le ${date}</div>
          </div>
          <div class="cv-actions">
            <button class="btn-small btn-view" onclick="window.location.href='success.html?cvId=${row.id}'">Voir / PDF</button>
            <button class="btn-small btn-edit" onclick="window.location.href='builder.html?cvId=${row.id}'">Modifier</button>
          </div>
        </div>`;
    }).join("");
  } catch (err) {
    listEl.innerHTML = `<div class="empty-state">Erreur lors du chargement de vos CV.</div>`;
  }
}

function escHtml(str) {
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
  window.location.reload();
});

checkAuth();
</script>

</body>
</html>
