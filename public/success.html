<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votre CV optimisé — CV Booster IA</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #22d3ee;
    --accent-2: #a78bfa;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 0%, #1e293b, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
  }
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 60px 24px;
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.subtitle { color: var(--muted); margin-bottom: 30px; }
  .card {
    background: var(--card);
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 28px;
  }
  #loading { text-align: center; padding: 40px 0; color: var(--muted); }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #334155;
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #result {
    display: none;
    white-space: pre-wrap;
    font-size: 0.95rem;
    line-height: 1.6;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 20px;
    max-height: 560px;
    overflow-y: auto;
  }
  #actions { display: none; margin-top: 18px; gap: 12px; }
  button {
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    font-weight: 700;
    cursor: pointer;
    margin-right: 10px;
  }
  #downloadBtn { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #0f172a; }
  #copyBtn { background: #334155; color: var(--text); }
  #errorBox {
    display: none;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
    padding: 14px 16px;
    border-radius: 10px;
  }
</style>
</head>
<body>
<main>
  <h1>✅ Paiement confirmé</h1>
  <p class="subtitle">Génération de votre CV optimisé en cours...</p>

  <div class="card">
    <div id="loading">
      <div class="spinner"></div>
      Notre IA analyse votre CV et l'offre d'emploi (environ 15-20 secondes)...
    </div>
    <div id="result"></div>
    <div id="actions">
      <button id="downloadBtn">Télécharger en .txt</button>
      <button id="copyBtn">Copier le texte</button>
    </div>
    <div id="errorBox"></div>
  </div>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const sessionId = params.get("session_id");

const loadingEl = document.getElementById("loading");
const resultEl = document.getElementById("result");
const actionsEl = document.getElementById("actions");
const errorBox = document.getElementById("errorBox");

async function generate() {
  if (!sessionId) {
    showError("Session de paiement introuvable.");
    return;
  }
  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId }),
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || "Erreur de génération");

    loadingEl.style.display = "none";
    resultEl.style.display = "block";
    resultEl.textContent = data.optimizedResume;
    actionsEl.style.display = "flex";
  } catch (err) {
    showError(err.message);
  }
}

function showError(msg) {
  loadingEl.style.display = "none";
  errorBox.style.display = "block";
  errorBox.textContent = "Erreur : " + msg + ". Contactez-nous, votre paiement a bien été reçu.";
}

document.getElementById("downloadBtn").addEventListener("click", () => {
  const blob = new Blob([resultEl.textContent], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "cv-optimise.txt";
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("copyBtn").addEventListener("click", () => {
  navigator.clipboard.writeText(resultEl.textContent);
  const btn = document.getElementById("copyBtn");
  const original = btn.textContent;
  btn.textContent = "Copié !";
  setTimeout(() => (btn.textContent = original), 1500);
});

generate();
</script>
</body>
</html>
